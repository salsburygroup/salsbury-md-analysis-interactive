name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        core-ref: [main, experimental]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools and package
        run: |
          python -m pip install --upgrade pip build ijson packaging
          python -m pip install --pre "salsbury-md-analysis @ git+https://github.com/salsburygroup/salsbury-md-analysis.git@${{ matrix.core-ref }}" .
          python -m pip check
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Build distributions
        run: python -m build
      - name: Install and test the wheel outside the source tree
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -q
      - name: Test offline browser controls and evidence links
        if: matrix.python-version == '3.12'
        env:
          SALSBURY_BROWSER_TESTS: "1"
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/tests" python -m unittest test_browser -v

  # Keep the protected branch's existing check names. Every gate requires the
  # complete main/experimental compatibility matrix, including wheel and browser
  # checks, to pass; a skipped, failed, or canceled matrix cannot satisfy it.
  test:
    if: always()
    needs: compatibility
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Require the complete compatibility matrix
        env:
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$COMPATIBILITY_RESULT" = success
