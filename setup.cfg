[metadata]
name = salsbury-md-analysis-interactive
version = 0.1.1
description = Offline interactive results browser for Salsbury MD Analysis campaigns
long_description = file: README.md
long_description_content_type = text/markdown
author = Freddie R. Salsbury Jr.
author_email = 112109925+salsburygroup@users.noreply.github.com
url = https://github.com/salsburygroup/salsbury-md-analysis-interactive
license = BSD-3-Clause
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Science/Research
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Chemistry
keywords = molecular dynamics, trajectory analysis, molecular visualization, reporting
project_urls =
    Documentation = https://github.com/salsburygroup/salsbury-md-analysis-interactive/tree/main/docs
    Source = https://github.com/salsburygroup/salsbury-md-analysis-interactive
    Issues = https://github.com/salsburygroup/salsbury-md-analysis-interactive/issues

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.10
include_package_data = True
install_requires =
    salsbury-md-analysis>=0.1.1,<0.2

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    salsbury-md-analysis-interactive = salsbury_md_analysis_interactive.cli:main

